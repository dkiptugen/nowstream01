<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <title>HLS Player with Plyr</title>
</head>
<body>
    <video id="player" controls></video>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const player = new Plyr(video, {
                // You can customize Plyr options here
            });

            // Your video URL
            const videoUrl = 'https://live.baze.co.ke/videos/007.mp4';

            // Function to determine video type
            function getVideoType(url) {
                const extension = url.split('.').pop();
                if (extension === 'm3u8') {
                    return 'application/vnd.apple.mpegurl';
                } else if (extension === 'mp4') {
                    return 'video/mp4';
                } else if (extension === 'mov') {
                    return 'video/quicktime';
                } else {
                    return '';
                }
            }

            // Function to load video based on its type
            function loadVideo(url) {
                const type = getVideoType(url);
                
                if (type === 'application/vnd.apple.mpegurl') {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play();
                        });
                    } else if (video.canPlayType(type)) {
                        video.src = url;
                        video.addEventListener('loadedmetadata', () => {
                            video.play();
                        });
                    } else {
                        console.error('HLS is not supported in this browser');
                    }
                } else if (video.canPlayType(type)) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                    });
                } else {
                    console.error('This video format is not supported in this browser');
                }
            }

            // Load the video
            loadVideo(videoUrl);
        });
    </script>
</body>
</html>
